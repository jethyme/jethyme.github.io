<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicon — временно недоступно</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d12;
            color: #e8e8ef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            text-align: center;
            max-width: 480px;
        }

        .title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #ff9ff3, #54a0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .msg {
            color: #9a9ab0;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .back {
            display: inline-block;
            margin-top: 28px;
            color: #a29bfe;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <div class="title">Chronicon</div>
        <div class="msg">Временно недоступно.<br>В разработке.</div>
        <a class="back" href="../index.html">&larr; Назад к проектам</a>
    </div>
</body>
</html>
