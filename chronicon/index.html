<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicon — Дизайн-документ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d12;
            color: #e8e8ef;
            line-height: 1.6;
            min-height: 100vh;
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #9a9ab0;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back:hover { color: #fff; }

        .notice {
            margin-bottom: 36px;
            padding: 18px 20px;
            background: rgba(84,160,255,0.08);
            border: 1px solid rgba(84,160,255,0.3);
            border-radius: 12px;
            color: #cfe4ff;
            font-size: 0.95rem;
        }

        .notice a { color: #a29bfe; }

        .notice .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #54a0ff;
            color: #051525;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .notice .btn:hover { background: #6fb1ff; }

        .offline-tag {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            background: rgba(255,107,107,0.2);
            color: #ff9b9b;
            border: 1px solid rgba(255,107,107,0.4);
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9ff3, #54a0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: #9a9ab0;
            font-size: 1rem;
            margin-bottom: 36px;
        }

        .toc {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 40px;
        }

        .toc h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #d0d0e0;
        }

        .toc ol { padding-left: 20px; color: #9a9ab0; }
        .toc li { margin: 6px 0; }
        .toc a { color: #a29bfe; text-decoration: none; }
        .toc a:hover { text-decoration: underline; }

        section {
            margin-bottom: 48px;
            padding: 24px;
            background: rgba(255,255,255,0.03);
            border-left: 3px solid #6c5ce7;
            border-radius: 8px;
        }

        section h2 {
            font-size: 1.5rem;
            margin-bottom: 14px;
            color: #cdc6ff;
        }

        section p, section li { color: #c6c6d4; margin-bottom: 10px; }
        ul { padding-left: 20px; }

        .empty-note { font-style: italic; color: #7a7a90; }

        .footer {
            text-align: center;
            color: #5a5a70;
            font-size: 0.85rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="wrap" id="root">
        <p style="color:#9a9ab0; text-align:center; padding:40px;">Проверка подключения…</p>
    </div>

    <script>
        // Живая версия диздока живёт на локальном сервере.
        const LIVE = 'http://85.142.166.29:3184/';

        const FALLBACK = {
            title: 'Chronicon',
            tagline: 'Дизайн-документ дипломной компьютерной ролевой игры (CRPG) — офлайн-копия',
            sections: [
                { id: 'concept', title: 'Концепция', body: 'TODO: краткий питч — что за игра, для кого, чем уникальна.' },
                { id: 'world', title: 'Мир и сеттинг', body: 'TODO: жанр мира, география, фракции, культура, правила мироздания.' },
                { id: 'story', title: 'Сюжет', body: 'TODO: завязка, цели, ключевые персонажи, развязки, ветвления.' },
                { id: 'gameplay', title: 'Геймплей и механики', body: 'TODO: цикл игры, исследование, диалоги, принятие решений, последствия.' },
                { id: 'systems', title: 'Системы и характеристики', body: 'TODO: атрибуты, навыки, ресурсы, состояния, эффекты.' },
                { id: 'combat', title: 'Боевая система', body: 'TODO: пошаговый бой, действия, AI, баланс.' },
                { id: 'progression', title: 'Прогрессия персонажа', body: 'TODO: очки опыта, уровни, дерево умений, развитие.' },
                { id: 'ui', title: 'Интерфейс', body: 'TODO: экраны, инвентарь, журнал, навигация, доступность.' },
                { id: 'tech', title: 'Техническая часть', body: 'TODO: движок/стек, платформа, архитектура, арт, звук.' },
                { id: 'scope', title: 'Объём и план разработки', body: 'TODO: список фич, этапы, сроки, тестирование, защита.' }
            ]
        };

        const ESC = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

        function render(data, offline) {
            const toc = data.sections.map(s =>
                `<li><a href="#${s.id}">${ESC(s.title)}</a></li>`).join('');
            const secs = data.sections.map(s =>
                `<section id="${s.id}"><h2>${ESC(s.title)}</h2>` +
                s.body.split('\n').filter(l => l.trim()).map(l => `<p>${ESC(l)}</p>`).join('') +
                `</section>`).join('');

            const notice = offline
                ? `<div class="notice">
                     Локальный сервер недоступен — показана офлайн-копия.<span class="offline-tag">офлайн</span>
                     <br><a class="btn" href="${LIVE}">Перейти к живой версии</a>
                   </div>`
                : '';

            document.getElementById('root').innerHTML =
                `<a class="back" href="../index.html">&larr; Назад к проектам</a>` +
                notice +
                `<h1>${ESC(data.title)}</h1>
                 <p class="tagline">${ESC(data.tagline || '')}</p>
                 <nav class="toc"><h2>Содержание</h2><ol>${toc}</ol></nav>
                 ${secs}
                 <footer class="footer">Chronicon — черновик дизайн-документа</footer>`;
        }

        function ping() {
            return new Promise((resolve) => {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 2500);
                fetch(LIVE, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
                    .then(() => { clearTimeout(t); resolve(true); })
                    .catch(() => { clearTimeout(t); resolve(false); });
            });
        }

        (async () => {
            const up = await ping();
            if (up) {
                // Сервер жив — уводим на живой инстанс.
                window.location.replace(LIVE);
            } else {
                render(FALLBACK, true);
            }
        })();
    </script>
</body>
</html>
