<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle — Слова</title>

<style>
:root {
    --cell-size: 54px;
    --cell-panel: 46px;
    --bg-empty: #3a3a3c;
    --bg-absent: #3a3a3c;
    --bg-present: #b59f3b;
    --bg-correct: #538d4e;
    --border: #565758;
    --key-bg: #818384;
    --key-bg-used: #4a4a4c;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    color: #fff;
    margin: 0;
    padding: 18px 10px 40px;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { text-align: center; font-size: 26px; margin: 4px 0 14px; letter-spacing: 1px; }
.start-panel, .panel {
    background: #2f2f4f;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    margin-bottom: 14px;
}
label { font-weight: 600; }
button {
    padding: 10px 15px;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    background: #5865f2;
    color: #fff;
    cursor: pointer;
    transition: 0.15s;
}
button:hover { filter: brightness(1.12); }
button:disabled { background: #5b5b6b; cursor: not-allowed; filter: none; }
button.ghost { background: #45456b; }
input[type="text"], input[type="number"] {
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    text-align: center;
    background: #3c3c5f;
    color: #fff;
}
input:focus { outline: 2px solid #5865f2; }
.row { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.row label { font-weight: bold; }
.hidden { display: none !important; }
.error { color: #ff6b6b; text-align: center; font-size: 14px; min-height: 18px; }
.status { text-align: center; font-size: 15px; margin-bottom: 10px; color: #d6d6e6; }
.status b { color: #fff; }

/* Панель управления */
.toolbar {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    margin-bottom: 12px;
}
.toolbar button { font-size: 13px; padding: 9px 14px; }
.toolbar button.active { background: #2f9e44; }

/* Попытка: буквы, а сразу за ними результат */
.attempt {
    display: flex; align-items: center; gap: 12px;
    padding: 7px 8px; border-radius: 10px; background: #26264a;
    margin-bottom: 8px;
}
.current-guess {
    display: flex; gap: 5px; justify-content: center; margin-bottom: 10px;
    min-height: var(--cell-panel);
}
.current-guess .tile { border-style: dashed; }
.attempt.current { background: #33335a; border: 1px dashed #56568a; }
.attempt .letters { display: flex; gap: 5px; }
.tile {
    width: var(--cell-panel);
    height: var(--cell-panel);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; text-transform: lowercase;
    border: 2px solid var(--border); border-radius: 5px; background: transparent;
}
.tile.small { width: 30px; height: 30px; font-size: 15px; border-width: 1px; }
.tile.shake, input.shake { animation: shake 0.35s; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
}

/* Цветные квадраты — сразу за буквами */
.squares { display: flex; gap: 5px; }
.sq {
    width: var(--cell-panel);
    height: var(--cell-panel);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; text-transform: lowercase;
}
.sq.correct { background: var(--bg-correct); }
.sq.present { background: var(--bg-present); }
.sq.absent { background: var(--bg-absent); }
.sq.small { width: 20px; height: 20px; font-size: 11px; border-radius: 3px; }

/* Быки и коровы */
.cows {
    display: flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 700; white-space: nowrap;
}
.cows .none { font-size: 16px; color: #8f8fa8; font-weight: 400; }
.attempt .author {
    margin-left: auto; font-size: 12px; color: #a5a5c0;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Клавиатура */
.keyboard { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.key {
    min-width: 34px; height: 46px; padding: 0 8px;
    border: none; border-radius: 5px;
    background: var(--key-bg); color: #fff;
    font-size: 15px; font-weight: 700; text-transform: uppercase;
}
.key.wide { min-width: 62px; font-size: 12px; }
.key.correct { background: var(--bg-correct); }
.key.present { background: var(--bg-present); }
.key.absent { background: var(--key-bg-used); }

/* Панели лучших и последних попыток */
.panel h3 { margin: 0 0 12px; font-size: 16px; color: #f9e79f; }
.panel h3 .count { color: #8f8fa8; font-weight: 400; font-size: 13px; }
.attempt-list { display: flex; flex-direction: column; }
.rank {
    display: inline-block; width: 22px; color: #8f8fa8; font-size: 13px;
    text-align: center; flex: 0 0 auto;
}
.empty-note { color: #8f8fa8; font-size: 13px; padding: 6px 2px; }
.win-message { text-align: center; font-size: 20px; font-weight: 700; margin: 12px 0; }
.win-message.ok { color: #6ab04c; }
.win-message.fail { color: #ff6b6b; }
.toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #4caf50; color: #fff; padding: 9px 16px; border-radius: 20px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
}
.loading { text-align: center; font-size: 13px; color: #bcbcd0; }
.emoji-row { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.emoji { cursor: pointer; opacity: 0.45; transition: opacity 0.2s; font-size: 18px; user-select: none; }
.emoji.active { opacity: 1; }
details summary { cursor: pointer; font-size: 14px; color: #cfcfdf; }
.history-list { margin-top: 10px; }
@media (max-width: 700px) {
    :root { --cell-size: 40px; --cell-panel: 34px; }
    .tile { font-size: 18px; }
    .sq { font-size: 16px; }
    .cows { font-size: 17px; gap: 6px; }
    .key { min-width: 26px; height: 42px; font-size: 13px; padding: 0 5px; }
    .key.wide { min-width: 46px; }
    .toolbar button { flex: 1 1 140px; }
    .attempt { gap: 8px; padding: 6px; }
}
</style>
</head>
<body>
<div class="wrap">
    <h1>🟩 Wordle 🟨</h1>

    <!-- Начало -->
    <div id="startPanel" class="start-panel">
        <div class="row">
            <label>Длина слова:</label>
            <input type="number" id="lengthInput" min="1" max="30" value="5" style="width:90px">
            <div id="lengthEmojis" class="emoji-row" style="width:100%;max-width:420px"></div>
        </div>
        <div class="row">
            <label>Своё слово (необязательно):</label>
            <input type="text" id="customWord" placeholder="например: слово" style="width:200px">
        </div>
        <div class="row">
            <button onclick="startGame()">▶ Начать игру</button>
            <span class="loading" id="dictStatus">📚 Загрузка словарей…</span>
        </div>
        <div class="error" id="startError"></div>
        <p style="text-align:center;font-size:13px;color:#a9a9c2;margin:6px 0 0">
            Попытки не ограничены. Угадывать можно сколько угодно раз.
        </p>
    </div>

    <!-- Игра -->
    <div id="gamePanel" class="hidden">
        <div class="toolbar">
            <button id="modeBtn" onclick="toggleMode()">Режим: 🐂🐄 быки-коровы</button>
            <button id="kbBtn" onclick="toggleKeyboard()">⌨️ Показать клавиатуру</button>
        </div>

        <div class="status" id="status"></div>

        <div class="current-guess" id="currentGuess"></div>

        <div class="row">
            <input type="text" id="guessInput" placeholder="Введите слово" maxlength="30"
                   autocomplete="off" autocapitalize="off" spellcheck="false" style="width:230px">
            <button onclick="submitGuess()">↵ Ответить</button>
        </div>
        <div class="error" id="guessError"></div>

        <div class="keyboard hidden" id="keyboard"></div>

        <div class="win-message" id="winMessage"></div>

        <div class="panel">
            <h3>🏆 Лучшие попытки</h3>
            <div class="attempt-list" id="bestList"></div>
        </div>

        <div class="panel">
            <h3>🕒 Последние попытки</h3>
            <div class="attempt-list" id="lastList"></div>
        </div>

        <details class="panel">
            <summary>📜 Вся история попыток</summary>
            <div class="attempt-list history-list" id="allList"></div>
        </details>

        <div class="row">
            <button class="ghost" onclick="copyResult()">📋 Скопировать результат</button>
            <button class="ghost" onclick="showAnswer()">👀 Показать ответ</button>
            <button class="ghost" onclick="restart()">🔄 Новая игра</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="wordle-core.js"></script>
<script>
const Core = window.WordleCore;

const KEYBOARD_ROWS = [
    ['й','ц','у','к','е','н','г','ш','щ','з','х','ъ'],
    ['ф','ы','в','а','п','р','л','д','ж','э'],
    ['ё','я','ч','с','м','и','т','ь','б','ю']
];

let dictionary = new Set();
let singularDictionary = new Set();
let dictionaryMaxLen = 20;
let dictionariesLoaded = false;

let secretWord = '';
let wordLength = 5;
let gameOver = false;
let guesses = [];
let keyStates = {};

/* 'cows' — быки и коровы, 'squares' — цветные квадраты */
let displayMode = localStorage.getItem('wordle_display_mode') || 'cows';
let keyboardVisible = false;

/* ---------- Словари ---------- */
async function loadDictionaries() {
    try {
        const [a, b] = await Promise.all([fetch('../cows/words.txt'), fetch('../cows/singular.txt')]);
        const w = (await a.text()).split('\n').map(x => x.trim().toLowerCase()).filter(Boolean);
        const s = (await b.text()).split('\n').map(x => x.trim().toLowerCase()).filter(Boolean);
        dictionary = new Set(w);
        singularDictionary = new Set(s);
        dictionaryMaxLen = w.reduce((m, x) => Math.max(m, x.length), 3);
        dictionariesLoaded = true;
        document.getElementById('dictStatus').textContent =
            `✅ Словари загружены (${w.length + s.length})`;
        renderLengthEmojis();
    } catch (e) {
        document.getElementById('dictStatus').textContent = '❌ Ошибка загрузки словарей';
    }
}

function inDictionary(word) {
    return dictionary.has(word) || singularDictionary.has(word);
}

/* ---------- Длина слова ---------- */
function renderLengthEmojis() {
    const val = parseInt(document.getElementById('lengthInput').value, 10) || 0;
    const max = Math.max(5, Math.min(dictionaryMaxLen, 20));
    let html = '';
    for (let i = 1; i <= max; i++) {
        html += `<span class="emoji ${i <= val ? 'active' : ''}" onclick="setLength(${i})">🟩</span>`;
    }
    document.getElementById('lengthEmojis').innerHTML = html;
}
function setLength(n) {
    document.getElementById('lengthInput').value = n;
    renderLengthEmojis();
}

/* ---------- Переключатели отображения ---------- */
function toggleMode() {
    displayMode = displayMode === 'cows' ? 'squares' : 'cows';
    localStorage.setItem('wordle_display_mode', displayMode);
    renderAll();
}

function toggleKeyboard() {
    keyboardVisible = !keyboardVisible;
    renderAll();
}

function updateModeButtons() {
    const modeBtn = document.getElementById('modeBtn');
    modeBtn.textContent = displayMode === 'cows'
        ? 'Режим: 🐂🐄 быки-коровы'
        : 'Режим: 🟩🟨 квадраты';
    modeBtn.classList.toggle('active', displayMode === 'squares');

    const kbBtn = document.getElementById('kbBtn');
    kbBtn.textContent = keyboardVisible ? '⌨️ Скрыть клавиатуру' : '⌨️ Показать клавиатуру';
    kbBtn.classList.toggle('active', keyboardVisible);

    document.getElementById('keyboard').classList.toggle('hidden', !keyboardVisible);
}

/* ---------- Старт ---------- */
function startGame() {
    const startError = document.getElementById('startError');
    if (!dictionariesLoaded) {
        startError.textContent = 'Словари ещё загружаются, подождите секунду';
        return;
    }
    const custom = document.getElementById('customWord').value.trim().toLowerCase();
    if (custom) {
        if (!inDictionary(custom)) {
            startError.textContent = 'Такого слова нет в словаре';
            return;
        }
        secretWord = custom;
        wordLength = custom.length;
    } else {
        const len = parseInt(document.getElementById('lengthInput').value, 10) || 5;
        const pool = [];
        for (const w of dictionary) if (w.length === len) pool.push(w);
        if (!pool.length) {
            startError.textContent = `Нет слов длины ${len} в словаре`;
            return;
        }
        secretWord = pool[Math.floor(Math.random() * pool.length)];
        wordLength = len;
    }
    startError.textContent = '';
    guesses = [];
    gameOver = false;
    keyStates = {};
    document.getElementById('startPanel').classList.add('hidden');
    document.getElementById('gamePanel').classList.remove('hidden');
    document.getElementById('winMessage').textContent = '';
    document.getElementById('winMessage').className = 'win-message';
    document.getElementById('guessInput').maxLength = wordLength;
    document.getElementById('guessInput').value = '';
    renderAll();
    document.getElementById('guessInput').focus();
}

function restart() {
    document.getElementById('gamePanel').classList.add('hidden');
    document.getElementById('startPanel').classList.remove('hidden');
    document.getElementById('customWord').value = '';
    document.getElementById('startError').textContent = '';
}

/* ---------- Отрисовка одной попытки ---------- */
function buildAttempt(guess, opts) {
    const options = opts || {};
    const row = document.createElement('div');
    row.className = 'attempt' + (options.current ? ' current' : '');

    const letters = document.createElement('div');
    letters.className = 'letters';
    const tileSize = options.small ? 'tile small' : 'tile';
    const marks = guess.marks || [];
    for (let i = 0; i < guess.word.length; i++) {
        const tile = document.createElement('div');
        tile.className = tileSize;
        tile.textContent = guess.word[i];
        letters.appendChild(tile);
    }
    row.appendChild(letters);

    /* Результат — сразу за буквами */
    if (displayMode === 'squares') {
        const squares = document.createElement('div');
        squares.className = 'squares';
        marks.forEach(mark => {
            const sq = document.createElement('div');
            const markValue = typeof mark === 'string' ? mark : mark.mark;
            sq.className = 'sq' + (options.small ? ' small' : '') + ' ' + markValue;
            squares.appendChild(sq);
        });
        row.appendChild(squares);
    } else {
        const cows = document.createElement('div');
        cows.className = 'cows';
        if (!guess.bulls && !guess.cows) {
            const none = document.createElement('span');
            none.className = 'none';
            none.textContent = '❌';
            cows.appendChild(none);
        } else {
            if (guess.bulls) {
                const b = document.createElement('span');
                b.textContent = '🐂'.repeat(guess.bulls);
                cows.appendChild(b);
            }
            if (guess.cows) {
                const c = document.createElement('span');
                c.textContent = '🐄'.repeat(guess.cows);
                cows.appendChild(c);
            }
        }
        row.appendChild(cows);
    }

    if (options.rank != null) {
        const rank = document.createElement('span');
        rank.className = 'rank';
        rank.textContent = '#' + options.rank;
        row.insertBefore(rank, row.firstChild);
    }

    if (options.author) {
        const author = document.createElement('div');
        author.className = 'author';
        author.textContent = options.author;
        row.appendChild(author);
    }

    return row;
}

/* ---------- Панели ---------- */
function renderCurrentGuess() {
    const box = document.getElementById('currentGuess');
    box.innerHTML = '';
    if (gameOver) return;
    for (let i = 0; i < wordLength; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = guessInput().value[i] || '';
        box.appendChild(tile);
    }
}

function renderList(container, items, opts) {
    container.innerHTML = '';
    if (!items.length) {
        const note = document.createElement('div');
        note.className = 'empty-note';
        note.textContent = 'Пока нет попыток';
        container.appendChild(note);
        return;
    }
    items.forEach((g, i) => {
        container.appendChild(buildAttempt(g, Object.assign({ rank: opts.withRank ? i + 1 : null }, opts)));
    });
}

function renderPanels() {
    const best = Core.rankBest(guesses, 5);
    const last = Core.lastGuesses(guesses, 10);
    renderList(document.getElementById('bestList'), best, { withRank: true });
    renderList(document.getElementById('lastList'), last, { withRank: false });
    renderList(document.getElementById('allList'), guesses.slice().reverse(), { withRank: false, small: true });
}

/* ---------- Клавиатура ---------- */
function renderKeyboard() {
    const kb = document.getElementById('keyboard');
    kb.innerHTML = '';
    KEYBOARD_ROWS.forEach(row => {
        const kbRow = document.createElement('div');
        kbRow.className = 'kb-row';
        row.forEach(ch => {
            const key = document.createElement('button');
            key.className = 'key' + (keyStates[ch] ? ' ' + keyStates[ch] : '');
            key.textContent = ch;
            key.onclick = () => typeChar(ch);
            kbRow.appendChild(key);
        });
        kb.appendChild(kbRow);
    });

    const bottom = document.createElement('div');
    bottom.className = 'kb-row';
    const back = document.createElement('button');
    back.className = 'key wide';
    back.textContent = '⌫';
    back.onclick = backspace;
    const enter = document.createElement('button');
    enter.className = 'key wide';
    enter.textContent = '↵';
    enter.onclick = submitGuess;
    bottom.appendChild(back);
    bottom.appendChild(enter);
    kb.appendChild(bottom);
}

/* ---------- Ввод ---------- */
function guessInput() {
    return document.getElementById('guessInput');
}

function typeChar(ch) {
    if (gameOver) return;
    const input = guessInput();
    if (input.value.length >= wordLength) return;
    input.value += ch;
    renderCurrentGuess();
    renderPanels();
}

function backspace() {
    if (gameOver) return;
    const input = guessInput();
    input.value = input.value.slice(0, -1);
    renderCurrentGuess();
    renderPanels();
}

function showGuessError(msg) {
    const err = document.getElementById('guessError');
    err.textContent = msg || '';
    const input = guessInput();
    input.classList.remove('shake');
    if (msg) {
        void input.offsetWidth;
        input.classList.add('shake');
    }
}

function submitGuess() {
    if (gameOver) return;
    const input = guessInput();
    const guess = input.value.trim().toLowerCase();

    if (!guess) return showGuessError('Введите слово');
    if (guess.length !== wordLength) {
        return showGuessError(`Неверная длина. Нужно ${wordLength} букв.`);
    }
    if (!inDictionary(guess)) {
        return showGuessError('Такого слова нет в словаре');
    }
    showGuessError('');

    const marks = Core.scoreGuess(guess, secretWord);
    const { bulls, cows } = Core.countBullsCows(guess, secretWord);
    const entry = {
        word: guess,
        bulls: bulls,
        cows: cows,
        marks: marks.map((m, i) => ({ text: guess[i], mark: m }))
    };
    guesses.push(entry);

    marks.forEach((mark, i) => {
        const ch = guess[i];
        const rank = { absent: 1, present: 2, correct: 3 };
        if (!keyStates[ch] || rank[mark] > rank[keyStates[ch]]) keyStates[ch] = mark;
    });

    input.value = '';
    renderAll();

    if (bulls === wordLength) {
        gameOver = true;
        const msg = document.getElementById('winMessage');
        msg.textContent = `🎉 Слово угадано: ${secretWord} (попыток: ${guesses.length})`;
        msg.className = 'win-message ok';
        input.disabled = true;
    }
}

function updateStatus() {
    const el = document.getElementById('status');
    el.innerHTML =
        `Длина слова: <b>${wordLength}</b> · Попыток сделано: <b>${guesses.length}</b> · <b>без ограничения</b>`;
}

function renderAll() {
    updateModeButtons();
    renderKeyboard();
    renderCurrentGuess();
    renderPanels();
    updateStatus();
}

/* ---------- Прочее ---------- */
function showAnswer() {
    const msg = document.getElementById('winMessage');
    msg.textContent = `Ответ: ${secretWord}`;
    msg.className = 'win-message fail';
}

function copyResult() {
    if (!guesses.length) {
        toast('Сначала сделайте хотя бы одну попытку', true);
        return;
    }
    const text = guesses.map(g => Core.shareRow(g.marks.map(m => m.mark))).join('\n');
    const payload = `Wordle ${wordLength} букв — ${guesses.length} попыток\n${text}`;
    navigator.clipboard.writeText(payload)
        .then(() => toast('Результат скопирован'))
        .catch(() => prompt('Скопируйте результат:', payload));
}

function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = isError ? '#d32f2f' : '#4caf50';
    el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

/* ---------- Клавиатура (аппаратная) ---------- */
document.addEventListener('keydown', e => {
    if (document.getElementById('gamePanel').classList.contains('hidden')) return;
    const inInput = e.target === guessInput();
    if (e.key === 'Enter') { submitGuess(); return; }
    if (e.key === 'Backspace') {
        if (inInput) return; // поле само удалит символ
        backspace();
        return;
    }
    if (/^[а-яёa-z]$/i.test(e.key)) {
        if (inInput) return; // поле само введёт символ
        typeChar(e.key.toLowerCase());
        e.preventDefault();
    }
});

guessInput().addEventListener('input', e => {
    const cleaned = e.target.value.toLowerCase().replace(/[^а-яёa-z]/g, '').slice(0, wordLength);
    if (cleaned !== e.target.value) e.target.value = cleaned;
    showGuessError('');
    renderCurrentGuess();
    renderPanels();
});
guessInput().addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitGuess(); }
});

document.getElementById('lengthInput').addEventListener('input', renderLengthEmojis);
updateModeButtons();
loadDictionaries();
</script>
</body>
</html>
